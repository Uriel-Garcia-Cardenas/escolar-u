<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs del sistema - ESCOLAR_U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <div class="logo"><img src="../assets/images/escudo_unam.png" alt="UNAM"></div>
        <div class="header-text">
            <h1 class="site-title">UNAM</h1>
            <p class="site-tagline">LIANA LOPEZ PACHECO · LOGS DEL SISTEMA</p>
        </div>
        <div class="logo logo-right"><img src="../assets/images/escudo_unam.png" alt="UNAM"></div>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark sticky-nav" id="mainNav">
    <div class="container">
        <a class="navbar-brand nav-home-btn" href="dashboard-admin.html">
            <i class="fas fa-arrow-left"></i> Volver al panel
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="btnSalir">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label"><strong>Buscar</strong></label>
                    <input type="text" class="form-control" id="buscador"
                           placeholder="Correo, acción o detalle...">
                </div>
                <div class="col-md-3">
                    <label class="form-label"><strong>Acción</strong></label>
                    <select class="form-select" id="filtroAccion">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label"><strong>Mostrar</strong></label>
                    <select class="form-select" id="filtroCantidad">
                        <option value="100" selected>100</option>
                        <option value="250">250</option>
                        <option value="500">500</option>
                    </select>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-outline-primary w-100" id="btnRefrescar">
                        <i class="fas fa-sync-alt"></i> Refrescar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-history me-2"></i> Historial de actividad</span>
            <span class="badge bg-info text-dark" id="contador">0 eventos</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width:160px;">Fecha</th>
                            <th style="width:220px;">Usuario</th>
                            <th style="width:130px;">Rol</th>
                            <th style="width:180px;">Acción</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="tablaLogs">
                        <tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<footer class="text-center mt-5">
    <div class="container p-3">
        © 2026 ESCOLAR_U - Logs
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { protegerPagina } from "../js/roles.js";
    import { logout } from "../js/auth.js";
    import { listarLogs, formatearFecha } from "../js/logs.js";

    protegerPagina("admin", "../");

    document.getElementById("btnSalir").addEventListener("click", async (e) => {
        e.preventDefault();
        await logout();
        window.location.href = "../index.html";
    });

    let logs = [];

    function colorAccion(accion) {
        if (!accion) return "secondary";
        if (accion.includes("login"))       return "primary";
        if (accion.includes("logout"))      return "secondary";
        if (accion.includes("crear"))       return "success";
        if (accion.includes("editar"))      return "warning";
        if (accion.includes("borrar"))      return "danger";
        if (accion.includes("calificar") || accion.includes("calificacion")) return "info";
        if (accion.includes("rol"))         return "dark";
        return "secondary";
    }

    function pintar() {
        const tbody = document.getElementById("tablaLogs");
        const busqueda = document.getElementById("buscador").value.trim().toLowerCase();
        const filtroAccion = document.getElementById("filtroAccion").value;

        let filtrados = logs.filter((l) => {
            const coincideTexto =
                (l.email || "").toLowerCase().includes(busqueda) ||
                (l.accion || "").toLowerCase().includes(busqueda) ||
                (l.detalle || "").toLowerCase().includes(busqueda);
            const coincideAccion = !filtroAccion || l.accion === filtroAccion;
            return coincideTexto && coincideAccion;
        });

        document.getElementById("contador").textContent = `${filtrados.length} evento(s)`;

        if (filtrados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No hay eventos que coincidan.</td></tr>';
            return;
        }

        tbody.innerHTML = "";
        filtrados.forEach((l) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><small>${formatearFecha(l.fecha)}</small></td>
                <td><small>${l.email || "—"}</small></td>
                <td><span class="badge bg-secondary">${l.rol || "—"}</span></td>
                <td><span class="badge bg-${colorAccion(l.accion)}">${l.accion || "—"}</span></td>
                <td><small>${l.detalle || ""}</small></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function cargar() {
        const tbody = document.getElementById("tablaLogs");
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>';

        const cantidad = Number(document.getElementById("filtroCantidad").value) || 100;
        const res = await listarLogs(cantidad);

        if (!res.ok) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${res.error}</td></tr>`;
            return;
        }

        logs = res.logs;

        const sel = document.getElementById("filtroAccion");
        const previo = sel.value;
        sel.innerHTML = '<option value="">Todas</option>';
        const accionesUnicas = [...new Set(logs.map((l) => l.accion).filter(Boolean))].sort();
        accionesUnicas.forEach((a) => {
            const opt = document.createElement("option");
            opt.value = a;
            opt.textContent = a;
            sel.appendChild(opt);
        });
        sel.value = previo;

        pintar();
    }

    document.getElementById("buscador").addEventListener("input", pintar);
    document.getElementById("filtroAccion").addEventListener("change", pintar);
    document.getElementById("filtroCantidad").addEventListener("change", cargar);
    document.getElementById("btnRefrescar").addEventListener("click", cargar);

    cargar();
</script>

</body>
</html>
