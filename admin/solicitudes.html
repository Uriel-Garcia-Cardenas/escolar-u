<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Ingreso - ESCOLAR_U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <div class="logo"><img src="../assets/images/escudo_unam.png" alt="UNAM"></div>
        <div class="header-text">
            <h1 class="site-title">UNAM</h1>
            <p class="site-tagline">LIANA LOPEZ PACHECO · SOLICITUDES DE INGRESO</p>
        </div>
        <div class="logo logo-right"><img src="../assets/images/escudo_unam.png" alt="UNAM"></div>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark sticky-nav" id="mainNav">
    <div class="container">
        <a class="navbar-brand nav-home-btn" href="javascript:history.back()">
            <i class="fas fa-arrow-left"></i> Volver al panel
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="btnSalir">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-user-clock me-2"></i> Solicitudes Pendientes</span>
            <span class="badge bg-warning text-dark" id="contadorSolicitudes">0</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Alumno</th>
                            <th>Contacto</th>
                            <th>Materias Solicitadas</th>
                            <th style="width:200px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes">
                        <tr><td colspan="4" class="text-center text-muted py-4">Cargando solicitudes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<footer class="text-center mt-5">
    <div class="container p-3">
        © 2026 ESCOLAR_U - Solicitudes de Ingreso
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { observarSesion, logout } from "../js/auth.js";
    import { listarSolicitudesPendientes, aprobarSolicitud, rechazarSolicitud } from "../js/solicitudes.js";
    import { listarMaterias } from "../js/materias.js";

    // Solo admin y supervisor
    observarSesion(({ logueado, rol }) => {
        if (!logueado) { window.location.href = "../index.html"; return; }
        if (rol !== "admin" && rol !== "supervisor") {
            window.location.href = "../pages/dashboard.html";
        }
    });

    document.getElementById("btnSalir").addEventListener("click", async (e) => {
        e.preventDefault();
        await logout();
        window.location.href = "../index.html";
    });

    let mapaMaterias = {};

    // 1. Cargar nombres de materias para traducir los IDs
    async function cargarMapaMaterias() {
        const res = await listarMaterias();
        if (res.ok) {
            res.materias.forEach(m => mapaMaterias[m.id] = m.nombre);
        }
    }

    // 2. Cargar solicitudes
    async function cargarSolicitudes() {
        const tbody = document.getElementById("tablaSolicitudes");
        const contador = document.getElementById("contadorSolicitudes");
        
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> Cargando...</td></tr>';

        const res = await listarSolicitudesPendientes();
        
        if (!res.ok) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">${res.error}</td></tr>`;
            return;
        }

        const solicitudes = res.solicitudes;
        contador.textContent = `${solicitudes.length} pendientes`;

        if (solicitudes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-success py-4"><i class="fas fa-check-circle me-2"></i>No hay solicitudes pendientes por revisar.</td></tr>';
            return;
        }

        tbody.innerHTML = "";
        solicitudes.forEach((s) => {
            // Traducir IDs de materias a nombres
            const nombresMaterias = (s.materias || []).map(id => mapaMaterias[id] || id).join(", ");

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>
                    <strong>${s.nombre || "—"}</strong><br>
                    <small class="text-muted">Cuenta: ${s.numCuenta || "—"}</small>
                </td>
                <td>
                    <small class="d-block"><i class="fas fa-envelope me-1"></i>${s.email}</small>
                    <small class="d-block"><i class="fas fa-phone me-1"></i>${s.celular || "—"}</small>
                </td>
                <td>
                    <span class="badge bg-secondary text-wrap text-start" style="max-width: 300px;">
                        ${nombresMaterias || "Ninguna seleccionada"}
                    </span>
                </td>
                <td>
                    <button class="btn btn-sm btn-success btn-aprobar" data-id="${s.id}">
                        <i class="fas fa-check"></i> Aprobar
                    </button>
                    <button class="btn btn-sm btn-outline-danger btn-rechazar" data-id="${s.id}">
                        <i class="fas fa-times"></i> Rechazar
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Listeners de botones
        tbody.querySelectorAll(".btn-aprobar").forEach(btn => {
            btn.addEventListener("click", () => procesarAprobacion(btn.dataset.id, solicitudes, btn));
        });
        tbody.querySelectorAll(".btn-rechazar").forEach(btn => {
            btn.addEventListener("click", () => procesarRechazo(btn.dataset.id, btn));
        });
    }

    // 3. Aprobar
    async function procesarAprobacion(id, solicitudes, btn) {
        if (!confirm("¿Estás seguro de aprobar esta solicitud? Se creará la cuenta del alumno.")) return;
        
        const solicitudData = solicitudes.find(s => s.id === id);
        if (!solicitudData) return;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        const res = await aprobarSolicitud(id, solicitudData);

        if (res.ok) {
            alert("✅ Alumno registrado con éxito. Ya puede iniciar sesión.");
            cargarSolicitudes();
        } else {
            alert("❌ Error: " + res.error);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Aprobar';
        }
    }

    // 4. Rechazar
    async function procesarRechazo(id, btn) {
        if (!confirm("¿Rechazar esta solicitud? La información se eliminará de la lista.")) return;
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        const res = await rechazarSolicitud(id);

        if (res.ok) {
            cargarSolicitudes();
        } else {
            alert("❌ Error: " + res.error);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-times"></i> Rechazar';
        }
    }

    // Inicializar
    async function init() {
        await cargarMapaMaterias();
        await cargarSolicitudes();
    }
    
    init();
</script>

</body>
</html>
